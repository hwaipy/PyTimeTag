name: Publish tagged release to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            setup.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os

          with open("setup.py", encoding="utf-8") as source:
              tree = ast.parse(source.read())

          version = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "version" for target in node.targets):
                  if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                      version = node.value.value
                      break

          if version is None:
              raise SystemExit("Could not find the package version in setup.py")

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")
          print(f"Publishing pytimetag {version} from {tag}")
          PY

      - name: Install and test Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt build twine
          python -m pip install -e .
          python -m unittest discover -s tests

      - name: Install and test Web GUI
        working-directory: webui
        run: |
          npm ci
          npm test
          npm run build

      - name: Build distributions
        run: python -m build

      - name: Validate distributions and bundled GUI
        shell: bash
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found: {wheels}")

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())

          required = {
              "pytimetag/device/SerutekTimeTag.py",
              "pytimetag/gui/webui_dist/index.html",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Wheel is missing required files: {missing}")
          if not any(name.startswith("pytimetag/gui/webui_dist/assets/") for name in names):
              raise SystemExit("Wheel is missing Web GUI assets")
          if any(name.startswith("tests/") for name in names):
              raise SystemExit("Wheel unexpectedly contains the test suite")
          print(f"Validated bundled files in {wheels[0]}")
          PY

      - name: Smoke-test wheel installation
        shell: bash
        run: |
          python -m venv /tmp/pytimetag-release-test
          /tmp/pytimetag-release-test/bin/python -m pip install --upgrade pip
          /tmp/pytimetag-release-test/bin/python -m pip install dist/*.whl
          /tmp/pytimetag-release-test/bin/python -c "from pytimetag.device.SerutekTimeTag import SerutekTimeTag; from pytimetag.gui.api import create_app"
          /tmp/pytimetag-release-test/bin/pytimetag --help >/dev/null

      - name: Preserve release distributions
        uses: actions/upload-artifact@v4
        with:
          name: pytimetag-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload distributions to PyPI
        run: python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI }}
